<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;padding:32px 20px;background:#f8f8f4;color:#183b32;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif">
    <main style="max-width:440px;margin:auto">
      <p style="font-size:15px;font-weight:700">WorldNiche</p>
      <h1 style="font-size:26px;line-height:1.25">Your sign-in code</h1>
      <p style="line-height:1.6">Enter this code in WorldNiche to continue.</p>
      <p style="font-size:34px;letter-spacing:7px;font-weight:700;font-variant-numeric:tabular-nums">{{ .Token }}</p>
      <p style="line-height:1.6">The code expires in 10 minutes and can be used once.</p>
      <p style="font-size:13px;line-height:1.6;color:#50665d">If you did not request this code, you can ignore this email. Do not share the code with anyone.</p>
    </main>
  </body>
</html>
