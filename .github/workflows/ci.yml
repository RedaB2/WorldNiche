name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether native checks are needed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py
      - name: Reject tracked private files and check ignore rules
        run: bash scripts/check.sh private
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  web:
    name: Website and listing assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: bash scripts/check.sh assets
      - run: bash scripts/check.sh web
      - run: npm --prefix apps/web run build:vercel

  backend:
    name: Backend security and database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated database test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          echo 'WORLDNICHE_PG_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"
      - run: bash scripts/check.sh backend

  swift:
    name: Swift logic tests
    needs: secrets
    if: needs.secrets.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/check.sh swift

  native:
    name: iOS build and UI tests
    needs: secrets
    if: needs.secrets.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned Xcode and simulator environment
        run: python3 scripts/ci_simulator.py --check-environment
      - name: Compile application and UI tests
        run: |
          xcodebuild build-for-testing \
            -project apps/ios/WorldNiche.xcodeproj -scheme WorldNiche \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath outputs/ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee outputs/ci/build.log
      - name: Run profile and journal tests on a ready simulator
        run: python3 scripts/ci_simulator.py
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simulator-results
          path: |
            outputs/ci/build.log
            outputs/ci/simulator/
          if-no-files-found: ignore
          retention-days: 7
