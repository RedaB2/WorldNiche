name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private files and check ignore rules
        run: bash scripts/check.sh private
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  web:
    name: Website and listing assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: bash scripts/check.sh assets
      - run: bash scripts/check.sh web
      - run: npm --prefix apps/web run build:vercel

  backend:
    name: Backend security and database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated database test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          echo 'WORLDNICHE_PG_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"
      - run: bash scripts/check.sh backend

  native:
    name: Swift and simulator
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/check.sh swift
      - name: Build and test profile and journal flows with synthetic data
        run: |
          device_id=$(xcrun simctl create WorldNiche-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max)
          xcodebuild test \
            -project apps/ios/WorldNiche.xcodeproj -scheme WorldNiche \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO -resultBundlePath outputs/ci.xcresult \
            -only-testing:WorldNicheUITests/ProfileSetupUITests \
            -only-testing:WorldNicheUITests/JournalUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simulator-results
          path: outputs/ci.xcresult
          if-no-files-found: ignore
          retention-days: 7
